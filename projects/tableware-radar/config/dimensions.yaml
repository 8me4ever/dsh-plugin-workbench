# ============================================================================
# 维度体系 v1 —— 阶段 B 人工产物，阶段 C 封闭枚举的【唯一真源】
# ----------------------------------------------------------------------------
# * 本文件由阶段 A 的开放编码结果人工固化而来（不外包给 LLM，见 §4.1/D3）。
# * 每维四要素：definition / judgement / values / positive_examples+negative_examples。
# * excluded_from_opportunity：SCN / SAF 必须为 true（不参与 opportunities[] /
#   selection_priority[] 排序），其余评分维度为 false。
# * 命名：维度 ID 大写（DUR/CLE/…）；枚举值小写下划线。
# * 版本号会写进 analysis.json.dimension_set_version 与每条 labeling。
# ============================================================================

version: dims-v1

dimensions:
  - id: DUR
    name: 耐用性
    definition: 材质与结构在长期使用、清洗、跌落、加热后的完好程度。
    judgement: 出现崩口/开裂/划痕/掉釉/变形/耐热衰减等耐久相关表述时打标。
    values:
      - durable_strong
      - chips_easily
      - cracks_easily
      - breaks_on_drop
      - scratches_easily
      - withstands_heat
      - warps_in_dishwasher
    positive_examples:
      - "still looks new after a year of daily use"
      - "survived countless dishwasher cycles without chipping"
    negative_examples:
      - "one plate chipped after a few washes"
      - "a hairline crack appeared near the rim"
    excluded_from_opportunity: false

  - id: CLE
    name: 易清洁
    definition: 清洁便利性，含手洗与洗碗机。
    judgement: 提及易擦洗、洗碗机安全、染色、残留、需手洗等时打标。
    values:
      - easy_to_clean
      - dishwasher_safe_claim
      - stain_retention
      - hard_to_clean
      - needs_hand_wash
    positive_examples:
      - "wipes clean with a quick rinse"
      - "goes straight into the dishwasher"
    negative_examples:
      - "stains from tomato sauce won't come out"
      - "have to scrub them every time"
    excluded_from_opportunity: false

  - id: AES
    name: 美观度
    definition: 外观设计、颜色、光泽与照片一致性。
    judgement: 提及造型、配色、釉面光泽、显廉价、与图片是否一致时打标。
    values:
      - attractive_design
      - elegant_look
      - colour_variation
      - dull_finish
      - looks_cheap
      - matches_photos
    positive_examples:
      - "elegant look, guests commented on them"
      - "looks exactly like the photos"
    negative_examples:
      - "colour is quite different from the listing photos"
      - "the finish looks a bit cheap"
    excluded_from_opportunity: false

  - id: SIZ
    name: 尺寸
    definition: 直径/容量/深度是否与描述及用途匹配。
    judgement: 提及过大过小、深度、容量、与描述尺寸偏差时打标。
    values:
      - good_size
      - too_small
      - too_large
      - deep_enough
      - shallow
      - not_as_described_size
    positive_examples:
      - "perfect size for a main course"
      - "deep enough to hold a proper portion"
    negative_examples:
      - "much smaller than described"
      - "too big to fit in my cupboard"
    excluded_from_opportunity: false

  - id: PCK
    name: 包装
    definition: 运输包装对商品的保护与合理性。
    judgement: 提及破损到货、缓冲不足、包装过度/极简、箱子压坏时打标。
    values:
      - well_protected
      - arrived_damaged
      - excessive_packaging
      - minimal_packaging
      - box_crushed
    positive_examples:
      - "arrived well packed with no damage"
      - "lots of padding, everything intact"
    negative_examples:
      - "two plates were cracked; box had no padding"
      - "flimsy packaging, one bowl was broken"
    excluded_from_opportunity: false

  - id: SCN
    name: 使用场景
    definition: 评论提及的具体使用场景（仅用于筛选切片，不参与机会分）。
    judgement: 提及日常/宴客/下午茶/烤肉/送礼/亲子/烘焙等场景时打标。
    values:
      - everyday_dining
      - entertaining
      - afternoon_tea
      - roast_dinner
      - gifting
      - kids_family
      - baking_serving
    positive_examples:
      - "used every day for family dinners"
      - "perfect for afternoon tea with guests"
    negative_examples:
      - "bought as a gift but arrived chipped"
    excluded_from_opportunity: true

  - id: STR
    name: 强度/结构
    definition: 厚度、重量、边缘与整体结构强度。
    judgement: 提及厚薄、轻重、结实/发飘、边缘厚度、结构稳定性时打标。
    values:
      - sturdy
      - flimsy
      - heavy_weight
      - lightweight
      - thick_rim
      - thin_rim
    positive_examples:
      - "thick and feels solid in the hand"
      - "nice heavy weight, not flimsy at all"
    negative_examples:
      - "very thin and feels flimsy"
      - "rim is too thin, worried it will chip"
    excluded_from_opportunity: false

  - id: HAN
    name: 手感/握持
    definition: 拿握、平衡与边缘触感。
    judgement: 提及手感、打滑、边缘割手、平衡性时打标。
    values:
      - comfortable_handling
      - slippery
      - sharp_edges
      - awkward_to_hold
      - balanced_weight
    positive_examples:
      - "comfortable to hold and well balanced"
      - "nice edge, easy to pick up"
    negative_examples:
      - "edges are a bit sharp to hold"
      - "quite slippery when wet"
    excluded_from_opportunity: false

  - id: VAL
    name: 性价比/价值
    definition: 价格与所获品质、数量、品牌的匹配度。
    judgement: 提及划算/贵/物有所值/超预期时打标。
    values:
      - good_value
      - overpriced
      - worth_it
      - cheap_feeling
      - better_than_price_suggests
    positive_examples:
      - "great value for a set of six"
      - "better quality than the price suggests"
    negative_examples:
      - "overpriced for the quality"
      - "feels cheap for what I paid"
    excluded_from_opportunity: false

  - id: SAF
    name: 合规/安全
    definition: 与安全、食品接触、材质声明相关的表述（单列风险，不参与机会分）。
    judgement: 提及无铅/食品级/微波/洗碗机安全声明或安全隐患时打标。
    values:
      - lead_free_claim
      - food_safe_claim
      - microwave_safe_claim
      - dishwasher_safe_claim
      - safety_concern
      - sharp_edge_risk
    positive_examples:
      - "advertised as lead-free and food safe"
      - "microwave and dishwasher safe as stated"
    negative_examples:
      - "concerned about the glaze safety"
      - "sharp edge feels like a safety risk"
    excluded_from_opportunity: true
